name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      # Build on the runner instead of in Oryx: Oryx's Node list lags upstream's engines pin
      # (^22.22.2 broke it on 2026-09-07), setup-node does not.
      - name: Get Node version
        id: node
        run: echo "version=$(node -p "require('./package.json').engines.node" | sed -E 's/[^0-9.]+//g')" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.node.outputs.version }}
      - run: yarn install
      - run: npm run build
      - name: Stamp version.json and copy SWA config
        run: |
          VERSION=$(jq -r '.version' public/version.json)
          echo "{\"version\": \"${VERSION}\", \"commit\": \"${GITHUB_SHA::7}\"}" > out/version.json
          cp staticwebapp.config.json out/
      - name: Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_DELIGHTFUL_FIELD_021474610 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "out"
          skip_app_build: true
      # Same alert as the API fork's deploy workflow: n8n files an Internal RCS ticket.
      - name: Alert n8n on failure
        if: failure() && github.event_name == 'push'
        env:
          WEBHOOK: ${{ secrets.N8N_CIPP_WEBHOOK }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          jq -n --arg m "CIPP frontend deploy failed (run ${{ github.run_id }}): cipp.relian.co is not on the latest main, so the frontend and API may be on different versions. Re-run: $RUN_URL" \
            '{Tenant:"None", API:"Deploy", Severity:"Alert", Username:"GitHub Actions", sentAsAlert:true, Message:$m}' \
            | curl -fsS -X POST -H 'Content-Type: application/json' --data @- "$WEBHOOK"

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_DELIGHTFUL_FIELD_021474610 }} # change this to your repository secret name
          action: "close"
